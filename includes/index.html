<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text</title>

    <style>
        body{
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:white;
            font-family:Arial, sans-serif;
            flex-direction:column;
        }

        h1{
            font-size:80px;
            margin-bottom:30px;
        }

        input{
            width:300px;
            padding:10px;
            font-size:18px;
        }

        p{
            color:gray;
        }
    </style>
</head>
<body>

<h1 id="texto"></h1>

<input id="entrada" type="text" placeholder="Escribe aquí">

<p>Take A Screenshot To Save!</p>

<script>
const input = document.getElementById("entrada");
const texto = document.getElementById("texto");

input.addEventListener("input", function () {
    texto.textContent = "" + input.value;
});
</script>

</body>
</html>
